[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "detection-engine"
version = "0.1.0"
description = "Parse SSH, web, Windows and CloudTrail logs into one format, run detection rules, and correlate alerts into incidents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
detection-engine = "detection_engine.__main__:main"

[tool.setuptools]
packages = ["detection_engine"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
